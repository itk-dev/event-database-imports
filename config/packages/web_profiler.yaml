when@dev:
    web_profiler:
        toolbar: true
        intercept_redirects: false

    framework:
        profiler:
            only_exceptions: false
            collect_serializer_data: true

when@test:
    framework:
        # `collect: true` is required so MailerAssertionsTrait can read the
        # message logger events via the profiler subsystem.
        profiler:
            collect: true
            only_exceptions: false
            collect_serializer_data: true
